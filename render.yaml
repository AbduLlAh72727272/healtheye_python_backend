services:
  # Python Prediction API for HealthEye - Multi-Fallback Deployment
  - type: web
    name: healtheye-python-backend
    env: python
    region: oregon
    plan: free
    buildCommand: python -m pip install --upgrade pip && (pip install -r requirements.txt || pip install -r requirements-lite.txt || pip install -r requirements-minimal.txt)
    startCommand: gunicorn --bind 0.0.0.0:$PORT --timeout 120 --workers 1 --max-requests 1000 prediction_server:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PORT
        value: 10000
      - key: PYTHONUNBUFFERED
        value: 1
    healthCheckPath: /health
    autoDeploy: true