services:
  # Python Prediction API for HealthEye - Multi-Fallback Deployment
  - type: web
    name: healtheye-python-backend
    env: python
    region: oregon
    plan: free
    runtime: python-3.10.12
    buildCommand: |
      echo "🔧 Setting up Python environment..."
      python --version
      python -m pip install --upgrade pip setuptools wheel
      echo "📦 Installing dependencies..."
      pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --timeout 120 --workers 1 --max-requests 1000 prediction_server:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PORT
        value: 10000
      - key: PYTHONUNBUFFERED
        value: 1
      - key: PYTHONDONTWRITEBYTECODE
        value: 1
    healthCheckPath: /health
    autoDeploy: true