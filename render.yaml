services:
  # Python Prediction API for HealthEye - Python 3.13 Compatible
  - type: web
    name: healtheye-python-backend
    env: python
    region: oregon
    plan: free
    buildCommand: |
      echo "🔧 Python version check..."
      python --version
      echo "📦 Upgrading pip and build tools..."
      python -m pip install --upgrade pip setuptools wheel
      echo "� Installing application dependencies..."
      pip install --no-cache-dir -r requirements.txt || pip install --no-cache-dir -r requirements-minimal.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --timeout 120 --workers 1 --max-requests 1000 --preload prediction_server:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PORT
        value: 10000
      - key: PYTHONUNBUFFERED
        value: 1
      - key: PYTHONDONTWRITEBYTECODE
        value: 1
    healthCheckPath: /health
    autoDeploy: true